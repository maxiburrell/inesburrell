name: Sync writing links from Substack and Persuasion

on:
  schedule:
    # Every 3 hours (UTC). GitHub may delay scheduled runs.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: writing-feed-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Import new article cards
        env:
          SYNC_SITE_URL: ${{ secrets.SYNC_SITE_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 \
            -X POST "${SYNC_SITE_URL%/}/api/sync-substack" \
            -H "Authorization: Bearer $SYNC_SECRET" \
            -H "X-Sanity-Token: $SANITY_WRITE_TOKEN"
